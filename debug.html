<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineage v2 — локальная отладка</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: #f1f5f9;
  }
  #toolbar {
    padding: 10px 16px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    gap: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  #toolbar label {
    font-size: 13px;
    color: #334155;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #toolbar button {
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #f8fafc;
  }
  #toolbar button:hover { background: #e2e8f0; }
  #chart-wrap {
    width: 100vw;
    height: calc(100vh - 52px);
  }
  #chart-wrap > div {
    width: 100%;
    height: 100%;
  }
  .hint {
    font-size: 12px;
    color: #64748b;
    margin-left: auto;
  }
</style>
</head>
<body>

<div id="toolbar">
  <label>CSV: <input type="file" id="file" accept=".csv"></label>
  <label><input type="checkbox" id="limit" checked> только первые 500 строк</label>
  <button id="btn">Запустить lineage_v2.js</button>
  <span class="hint">id блока должен совпадать с BLOCK_ID из lineage_v2.js</span>
</div>

<div id="chart-wrap">
  <!-- ID должен быть равен BLOCK_ID в lineage_v2.js -->
  <div id="82hdt27oq8j739qz6skpqrl1kpvgv9dx"></div>
</div>

<script>
// ============================================================
// Мок окружения PIX BI
// ============================================================
window.themeConfigs = {
  application: {
    background: { items: '#ffffff', filter_panel: '#ffffff' },
    applied_filters: {}
  },
  texts: { labels: {} }
};

let parsedRows = [];

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(';').map(h => h.trim().replace(/^"|"$/g, ''));
  const out = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].split(';').map(v => v.trim().replace(/^"|"$/g, ''));
    const row = {};
    headers.forEach((h, j) => row[h] = vals[j] ?? '');
    out.push(row);
  }
  return out;
}

window.getItemData = async function (blockId) {
  let rows = parsedRows;
  if (document.getElementById('limit').checked) {
    rows = rows.slice(0, 500);
  }
  return {
    categories: rows
      .map(r => ({ name: r.lineage_key || '', value: Number(r.cnt) || 0 }))
      .filter(c => c.name.trim() !== ''),
    measures: [{ value: rows.length }]
  };
};

// ============================================================
// UI: загрузка CSV
// ============================================================
document.getElementById('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const text = await f.text();
  parsedRows = parseCSV(text);
  const limit = document.getElementById('limit').checked;
  const displayCount = limit ? Math.min(parsedRows.length, 500) : parsedRows.length;
  document.getElementById('btn').textContent = `Запустить lineage_v2.js (${displayCount} / ${parsedRows.length})`;
});

// ============================================================
// UI: запуск lineage_v2.js
// ============================================================
document.getElementById('btn').addEventListener('click', () => {
  const BLOCK_ID = '82hdt27oq8j739qz6skpqrl1kpvgv9dx';
  const wrap = document.getElementById(BLOCK_ID);

  // Чистим предыдущий рендер
  wrap.innerHTML = '';
  const oldScript = document.querySelector('script[data-viz="lineage_v2"]');
  if (oldScript) oldScript.remove();

  // line_age_v2.js сам создаёт внутренний div и echarts.init — достаточно очистить wrap
  const s = document.createElement('script');
  s.src = 'lineage_v2.js';
  s.dataset.viz = 'lineage_v2';
  s.onerror = () => alert('Не удалось загрузить lineage_v2.js. Открой эту страницу через локальный сервер (например, npx serve), а не через file://');
  document.body.appendChild(s);
});
</script>

</body>
</html>
